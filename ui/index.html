<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>workflow-distiller</title>
<style>
  :root{
    --bg:#0f1115; --panel:#181b22; --panel2:#1f232c; --line:#2a2f3a;
    --txt:#e8eaed; --muted:#9aa3b2; --accent:#6ea8fe;
    --eliminate:#7a8290; --automate:#3ea6ff; --skill:#b388ff; --human:#ffb454;
    --good:#3ddc97; --bad:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif}
  .wrap{max-width:1080px;margin:0 auto;padding:28px 22px 80px}
  .top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
  .topbtns{display:flex;gap:8px;align-items:center}
  h1{font-size:20px;margin:0 0 4px;font-weight:650}
  .sub{color:var(--muted);font-size:12.5px;margin-bottom:22px}
  .banner{border-radius:14px;padding:20px 22px;margin-bottom:26px;
          background:linear-gradient(135deg,#13351f,#0f1115);border:1px solid #1c5236}
  .banner.bad{background:linear-gradient(135deg,#3a1417,#0f1115);border-color:#5a2226}
  .banner .big{font-size:22px;font-weight:700;letter-spacing:.2px}
  .banner .meta{color:var(--muted);font-size:12.5px;margin-top:8px}
  .banner .chips{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap}
  .chip{background:#0f1115;border:1px solid var(--line);border-radius:999px;
        padding:3px 11px;font-size:12px;color:var(--muted)}
  .chip b{color:var(--txt)}
  section{margin-bottom:30px}
  h2{font-size:15px;margin:0 0 12px;font-weight:620;display:flex;align-items:center;gap:8px}
  h2 .n{color:var(--muted);font-weight:400;font-size:12.5px}
  table{width:100%;border-collapse:collapse;background:var(--panel);
        border:1px solid var(--line);border-radius:12px;overflow:hidden}
  th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
  th{background:var(--panel2);color:var(--muted);font-weight:600;font-size:12px}
  tr:last-child td{border-bottom:none}
  tr.click{cursor:pointer} tr.click:hover td{background:#20242e}
  td .wf{font-weight:600} td .sm{color:var(--muted);font-size:12px;margin-top:3px}
  .badge{display:inline-block;padding:2px 9px;border-radius:6px;font-size:12px;font-weight:600;color:#0f1115}
  .b-eliminate{background:var(--eliminate)} .b-automate{background:var(--automate)}
  .b-skill{background:var(--skill)} .b-human{background:var(--human)}
  .bar{display:flex;height:8px;border-radius:5px;overflow:hidden;background:#0f1115;margin-top:6px;width:120px}
  .bar i{display:block;height:100%}
  .barlabel{font-size:11px;color:var(--muted);margin-top:4px}
  select,input[type=text]{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
         border-radius:8px;padding:6px 9px;font-size:13px}
  input[type=text]{width:100%}
  .skill{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;cursor:pointer;
         padding:13px 15px;background:var(--panel);border:1px solid var(--line);
         border-radius:11px;margin-bottom:9px}
  .skill:hover{border-color:#3a4150}
  .skill .nm{font-weight:600} .skill .ds{color:var(--muted);font-size:12px;margin-top:3px;max-width:680px}
  .flow{color:var(--muted);font-size:11.5px;margin-top:6px}
  .err{color:var(--bad);font-size:13px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:-4px 0 14px}
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block}
  a{color:var(--accent)}
  button{font:inherit;cursor:pointer;border-radius:8px;border:1px solid var(--line);
         background:var(--panel2);color:var(--txt);padding:7px 13px}
  button.primary{background:#1d4ed8;border-color:#1d4ed8;color:#fff;font-weight:600}
  button.ghost{background:transparent}
  button:hover{filter:brightness(1.12)}
  .gear{background:transparent;border:1px solid var(--line);border-radius:9px;padding:7px 12px;font-size:13px}
  .langtog b{color:var(--txt)} .langtog span{color:var(--muted)}
  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;z-index:40}
  .scrim.open{display:block}
  .drawer{position:fixed;top:0;right:0;height:100%;width:min(680px,94vw);background:var(--panel);
          border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.5);
          transform:translateX(100%);transition:transform .18s ease;z-index:50;
          display:flex;flex-direction:column}
  .drawer.open{transform:translateX(0)}
  .drawer .hd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;
              justify-content:space-between;align-items:flex-start;gap:12px}
  .drawer .hd .ttl{font-size:16px;font-weight:650}
  .drawer .hd .x{cursor:pointer;color:var(--muted);font-size:20px;line-height:1;background:none;border:none}
  .drawer .bd{padding:16px 20px;overflow:auto;flex:1}
  .drawer .ft{padding:13px 20px;border-top:1px solid var(--line);display:flex;
              gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
  .drawer textarea{width:100%;min-height:340px;background:#0c0e12;color:#e8eaed;border:1px solid var(--line);
       border-radius:10px;padding:12px;font:12.5px/1.5 "SF Mono",ui-monospace,Menlo,monospace;resize:vertical}
  .fld{margin-bottom:14px}
  .fld label{display:block;color:var(--muted);font-size:12px;margin-bottom:6px}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .note{color:var(--muted);font-size:12px;margin-top:6px}
  .status{font-size:12.5px;margin-right:auto}
  .status.ok{color:var(--good)} .status.bad{color:var(--bad)}
  .stepline{padding:8px 0;border-bottom:1px solid var(--line)}
  .stepline:last-child{border-bottom:none}
  .panelbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .chk{display:flex;gap:9px;align-items:flex-start;padding:7px 0}
  .chk input{margin-top:3px}
  .chk .l{font-weight:600} .chk .d{color:var(--muted);font-size:12px}
  .pill{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
  .pill.on{color:var(--good);border-color:#1c5236} .pill.off{color:var(--muted)}
  @media(max-width:680px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1>workflow-distiller</h1>
      <div class="sub" data-i18n="sub"></div>
    </div>
    <div class="topbtns">
      <button class="gear langtog" id="langbtn" onclick="toggleLang()"></button>
      <button class="gear" onclick="toggleSettings()" data-i18n="settings_btn"></button>
    </div>
  </div>

  <div id="banner" class="banner"><div class="big" data-i18n="loading"></div></div>

  <section id="settings" style="display:none">
    <div class="panelbox">
      <h2 style="margin-bottom:14px"><span>⚙ </span><span data-i18n="set_title"></span> <span class="n" data-i18n="set_subtitle"></span></h2>
      <div class="grid2">
        <div>
          <div class="sub" style="margin-bottom:6px" data-i18n="set_sources_label"></div>
          <div id="set-sources"></div>
        </div>
        <div>
          <div class="sub" style="margin-bottom:6px" data-i18n="set_sinks_label"></div>
          <div id="set-sinks"></div>
          <div class="fld" style="margin-top:10px">
            <label data-i18n="set_slack_label"></label>
            <input id="set-slack" type="text" placeholder="https://hooks.slack.com/services/..."/>
          </div>
        </div>
      </div>
      <div class="fld" style="margin-top:10px">
        <label data-i18n="set_target_label"></label>
        <select id="set-target"></select>
      </div>
      <div class="row" style="margin-top:6px">
        <button class="primary" onclick="savePlatforms()" data-i18n="set_save"></button>
        <span id="set-status" class="status"></span>
      </div>
      <div class="note" data-i18n="set_note"></div>
    </div>
  </section>

  <section>
    <h2>Workflow Map <span class="n" id="mapcount"></span></h2>
    <div class="legend">
      <span><i class="dot b-eliminate"></i><span data-i18n="b_eliminate"></span></span>
      <span><i class="dot b-automate"></i><span data-i18n="b_automate"></span></span>
      <span><i class="dot b-skill"></i><span data-i18n="b_skill"></span></span>
      <span><i class="dot b-human"></i><span data-i18n="b_human"></span></span>
      <span style="margin-left:auto" data-i18n="legend_hint"></span>
    </div>
    <div id="maphead" class="sub"></div>
    <table id="maptable"><thead><tr>
      <th data-i18n="th_wf"></th><th data-i18n="th_bucket"></th><th data-i18n="th_freq"></th>
      <th data-i18n="th_est"></th><th data-i18n="th_steps"></th><th data-i18n="th_next"></th>
    </tr></thead><tbody id="mapbody"><tr><td colspan="6" data-i18n="loading"></td></tr></tbody></table>
  </section>

  <section>
    <h2>Skills
      <span class="n" id="skhint"></span>
      <select id="skplatform" style="margin-left:auto" onchange="loadSkills()"></select>
    </h2>
    <div id="skills"><div class="sub" data-i18n="loading"></div></div>
  </section>
</div>

<!-- drawer -->
<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true">
  <div class="hd">
    <div class="ttl" id="dwttl">—</div>
    <button class="x" onclick="closeDrawer()" aria-label="Close">×</button>
  </div>
  <div class="bd" id="dwbd"></div>
  <div class="ft" id="dwft"></div>
</aside>

<script>
/* ===================== i18n ===================== */
const I18N = {
  zh: {
    sub: "观察 AI 协作会话，将复发工作流蒸馏为四类——消除 / 自动化 / Skill / 人。点击任意行可展开、编辑并应用到生产。",
    settings_btn: "⚙ 设置",
    set_title: "平台设置", set_subtitle: "配置观察源与通知渠道（可插拔）",

    set_sinks_label: "通知 / 输出渠道",

    set_target_label: "应用到生产 · 默认目标平台",

    legend_hint: "点击行查看详情",
    th_wf:"工作流", th_bucket:"主类", th_freq:"频率", th_est:"估时/次", th_steps:"步骤分类", th_next:"下一步",
    b_eliminate:"消除", b_automate:"自动化", b_skill:"Skill", b_human:"人",
    banner_meta: d => `近 ${d} 天 · 基于会话记录的实测计数`,
    banner_headline: (s,a) => `本周 skill 调用 ${s} 次 · 自动化运行 ${a} 次`,
    chip_skill: "skill 调用", chip_auto: "自动化运行",
    chip_noskill: "本周无 skill 调用记录",
    chip_est: m => `估算净省 ~${m}min`, chip_est_title: "估算值，仅供参考",
    banner_err: m => `使用概览载入失败：${m}`,
    mapcount: (n,sess,bs,meet) => `${n} 条 · 观察 ${sess} 个会话${bs} + ${meet} 场会议`,
    map_empty: "尚未运行 distill", map_err: m => `Map 载入失败：${m}`,
    sk_hint: (p,flow) => `平台 ${p} · 自主度：${flow}`,
    sk_empty: "该平台暂无 Skill。可在 Workflow Map 中选择一行，通过「蒸馏成 Skill」生成。",
    sk_flow: "编辑 Skill 内容与自主度；应用到生产时自动备份原版",
    sk_err: m => `Skills 载入失败：${m}`,
    unsupported: "（不支持）",
    autonomy: { suggest:"仅建议", draft:"待批草稿", auto_notify:"自动 + 通知", full_auto:"全自动" },
    dw_wf_title: n => `工作流 · ${n}`,
    dw_meta: (f,e,n) => ` 频率 ${f} · ~${e}min/次 · 观察 ${n} 次`,
    dw_summary:"摘要", dw_next:"下一步建议", dw_steps:"步骤 × 分类", dw_instances:"观察到的实例",
    dw_nosteps:"（无步骤拆解）",
    btn_close:"关闭", btn_cancel:"取消", btn_distill:"蒸馏成 Skill", btn_apply:"应用到生产",
    promote_drafting:"正在生成 Skill 草稿…", promote_fail: e => `生成失败：${e}`,
    read_fail:"读取失败",
    ed_from: w => `由工作流「${w}」蒸馏生成的草稿，可编辑后应用。`,
    ed_path: p => `当前生效文件：${p}`,
    ed_name:"Skill 名（文件标识）", ed_target:"目标平台", ed_autonomy:"自主度",
    ed_content:"内容（frontmatter + 正文）",
    ed_note:"「应用到生产」会先将原版备份至 data/backups/，再原子写回该平台的对应路径。",
    ed_title: (isNew,n) => `${isNew?"新建":"编辑"} Skill · ${n}`,
    apply_empty:"名称 / 内容不能为空", apply_writing:"写入中…",
    apply_ok: (p,b) => `已应用到生产 → ${p}${b?`（原版已备份 ${b}）`:""}`,
    fail: e => `失败：${e}`,
    pill_detected:"已检测", pill_undetected:"未检测", pill_avail:"可用", pill_unset:"未配置",
    set_skilltarget: k => `Skill 目标：${k}`,
    slack_masked:"********（已配置，留空不改）",
    saving:"保存中…", saved: s => `已保存 ${s}（即时生效）`,
  },
  en: {
    sub: "Observe AI coding sessions and distill recurring workflows into four categories — Eliminate / Automate / Skill / Human. Click any row to expand, edit, and apply to production.",
    settings_btn: "⚙ Settings",
    set_title: "Platform settings", set_subtitle: "Configure observation sources and delivery channels (pluggable)",
    set_sources_label: "Observation sources (Agent platforms — also Skill targets)",
    set_sinks_label: "Delivery channels",
    set_slack_label: "Slack Incoming Webhook (required to enable Slack)",
    set_target_label: "Apply to production · default target platform",
    set_save: "Save",
    set_note: "Empty = auto-detect all available platforms. Changes take effect immediately (no restart). Written to config.local.json.",
    loading: "Loading…",
    legend_hint: "Click a row for details",
    th_wf:"Workflow", th_bucket:"Category", th_freq:"Frequency", th_est:"Est./run", th_steps:"Step breakdown", th_next:"Next step",
    b_eliminate:"Eliminate", b_automate:"Automate", b_skill:"Skill", b_human:"Human",
    banner_meta: d => `Last ${d} days · measured from session logs`,
    banner_headline: (s,a) => `This week: ${s} skill invocation${s==1?"":"s"} · ${a} automation run${a==1?"":"s"}`,
    chip_skill: "Skill invocations", chip_auto: "Automation runs",
    chip_noskill: "No skill invocations this week",
    chip_est: m => `Est. net saved ~${m}min`, chip_est_title: "Estimate, for reference only",
    banner_err: m => `Failed to load overview: ${m}`,
    mapcount: (n,sess,bs,meet) => `${n} workflows · ${sess} sessions${bs} + ${meet} meetings`,
    map_empty: "distill has not run yet", map_err: m => `Failed to load Map: ${m}`,
    sk_hint: (p,flow) => `Platform ${p} · Autonomy: ${flow}`,
    sk_empty: "No Skills on this platform yet. Pick a row in the Workflow Map and use “Distill into Skill” to generate one.",
    sk_flow: "Edit Skill content and autonomy; the previous version is backed up on apply.",
    sk_err: m => `Failed to load Skills: ${m}`,
    unsupported: " (unsupported)",
    autonomy: { suggest:"Suggest only", draft:"Draft for review", auto_notify:"Auto + notify", full_auto:"Fully automatic" },
    dw_wf_title: n => `Workflow · ${n}`,
    dw_meta: (f,e,n) => ` Frequency ${f} · ~${e}min/run · observed ${n}×`,
    dw_summary:"Summary", dw_next:"Recommended next step", dw_steps:"Steps × category", dw_instances:"Observed instances",
    dw_nosteps:"(no step breakdown)",
    btn_close:"Close", btn_cancel:"Cancel", btn_distill:"Distill into Skill", btn_apply:"Apply to production",
    promote_drafting:"Generating Skill draft…", promote_fail: e => `Generation failed: ${e}`,
    read_fail:"Failed to read",
    ed_from: w => `Draft distilled from workflow “${w}”. Edit before applying.`,
    ed_path: p => `Current file: ${p}`,
    ed_name:"Skill name (file identifier)", ed_target:"Target platform", ed_autonomy:"Autonomy",
    ed_content:"Content (frontmatter + body)",
    ed_note:"“Apply to production” backs up the previous version to data/backups/, then atomically writes to the platform’s path.",
    ed_title: (isNew,n) => `${isNew?"New":"Edit"} Skill · ${n}`,
    apply_empty:"Name / content cannot be empty", apply_writing:"Writing…",
    apply_ok: (p,b) => `Applied to production → ${p}${b?` (previous version backed up: ${b})`:""}`,
    fail: e => `Failed: ${e}`,
    pill_detected:"detected", pill_undetected:"not detected", pill_avail:"available", pill_unset:"not configured",
    set_skilltarget: k => `Skill target: ${k}`,
    slack_masked:"******** (configured; leave blank to keep)",
    saving:"Saving…", saved: s => `Saved ${s} (effective immediately)`,
  },
};
const ENLABEL = { claude_code:"Claude Code", cursor:"Cursor", codex:"Codex CLI",
  feishu:"Feishu / Lark", local:"Local file (data/out)", slack:"Slack (Incoming Webhook)" };

let LANG = localStorage.getItem("wd_lang")
  || ((navigator.language||"").toLowerCase().startsWith("zh") ? "zh" : "en");
function t(k,...a){ let v=(I18N[LANG]&&I18N[LANG][k]); if(v===undefined) v=I18N.zh[k]; if(v===undefined) v=k;
  return typeof v==="function" ? v(...a) : v; }
function autoLabel(val){ const m=(I18N[LANG]&&I18N[LANG].autonomy)||I18N.zh.autonomy; return m[val]||val; }
function plabel(key,serverLabel){ return LANG==="en" ? (ENLABEL[key]||serverLabel) : serverLabel; }

function applyStatic(){
  document.documentElement.lang = (LANG==="zh"?"zh-CN":"en");
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.getAttribute("data-i18n")); });
  const lb=document.getElementById("langbtn");
  lb.innerHTML = LANG==="zh" ? '<b>中</b><span> / EN</span>' : '<span>中 / </span><b>EN</b>';
}
function toggleLang(){
  LANG = LANG==="zh" ? "en" : "zh";
  localStorage.setItem("wd_lang", LANG);
  applyStatic();
  loadBanner().catch(()=>{}); loadMap().catch(()=>{}); loadSkills().catch(()=>{});
  if(document.getElementById("settings").style.display!=="none") loadPlatforms().catch(()=>{});
}

/* ===================== app ===================== */
const BUCKETS=["eliminate","automate","skill","human"];
const BCOLOR={eliminate:"var(--eliminate)",automate:"var(--automate)",skill:"var(--skill)",human:"var(--human)"};
const bname=b=>t("b_"+b)||b;
const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let MAP={workflows:[]}, PLAT=null, SKILLPLATS=[];

async function jget(u){const r=await fetch(u);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);return r.json();}
async function jpost(u,b){const r=await fetch(u,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});return r.json();}

/* ---------- banner ---------- */
async function loadBanner(){
  const u=await jget("/api/usage?days=7");
  const el=document.getElementById("banner");
  el.className="banner";
  const skillChips=Object.entries(u.by_skill||{})
    .map(([k,v])=>`<span class="chip">${esc(k)} <b>×${v}</b></span>`).join("");
  const noUse=(u.skill_total===0)?`<span class="chip">${esc(t("chip_noskill"))}</span>`:"";
  el.innerHTML=`<div class="big">${esc(t("banner_headline",u.skill_total,u.automation_runs))}</div>
    <div class="meta">${esc(t("banner_meta",u.window_days))}</div>
    <div class="chips">
      <span class="chip">${esc(t("chip_skill"))} <b>${u.skill_total}</b></span>
      <span class="chip">${esc(t("chip_auto"))} <b>${u.automation_runs}</b></span>
      ${skillChips}${noUse}
      <span class="chip" style="opacity:.55" title="${esc(t("chip_est_title"))}">${esc(t("chip_est",u.est_net_min))}</span>
    </div>`;
}

/* ---------- map ---------- */
function bucketBar(steps){
  const c={eliminate:0,automate:0,skill:0,human:0};
  (steps||[]).forEach(st=>{if(c[st.bucket]!=null)c[st.bucket]++;});
  const total=Object.values(c).reduce((a,b)=>a+b,0)||1;
  const segs=BUCKETS.filter(b=>c[b]>0).map(b=>`<i style="width:${c[b]/total*100}%;background:${BCOLOR[b]}"></i>`).join("");
  const lbl=BUCKETS.filter(b=>c[b]>0).map(b=>`${bname(b)}×${c[b]}`).join(" / ");
  return `<div class="bar">${segs}</div><div class="barlabel">${lbl||"-"}</div>`;
}
async function loadMap(){
  MAP=await jget("/api/map");
  document.getElementById("maphead").textContent=MAP.headline||"";
  const bs=MAP.by_source?" ("+Object.entries(MAP.by_source).map(([k,v])=>`${k}:${v}`).join(" ")+")":"";
  document.getElementById("mapcount").textContent=
    t("mapcount",(MAP.workflows||[]).length, MAP.n_sessions||"?", bs, MAP.n_meetings||"?");
  const body=document.getElementById("mapbody");
  if(!(MAP.workflows||[]).length){body.innerHTML=`<tr><td colspan="6">${esc(t("map_empty"))}</td></tr>`;return;}
  body.innerHTML=MAP.workflows.map((w,i)=>`
    <tr class="click" onclick="openWorkflow(${i})">
      <td><div class="wf">${esc(w.name)}</div><div class="sm">${esc(w.summary||"")}</div></td>
      <td><span class="badge b-${w.primary_bucket}">${esc(bname(w.primary_bucket))}</span></td>
      <td>${esc(w.frequency)}</td>
      <td>~${esc(w.est_minutes_per_run)}min<div class="sm">×${esc(w.n_observed)}</div></td>
      <td>${bucketBar(w.steps)}</td>
      <td>${esc(w.recommendation)}</td>
    </tr>`).join("");
}

/* ---------- skills ---------- */
async function loadSkills(){
  const sel=document.getElementById("skplatform");
  const pk=sel.value||"";
  const data=await jget("/api/skills"+(pk?`?platform=${encodeURIComponent(pk)}`:""));
  SKILLPLATS=data.platforms||[];
  window.SKLEVELS=data.levels||[];
  // platform options re-rendered each time so labels follow language
  const cur=sel.value||data.platform;
  sel.innerHTML=(data.platforms||[]).map(p=>`<option value="${p.key}" ${p.key===cur?"selected":""}>${esc(plabel(p.key,p.label))}${p.writable?"":esc(t("unsupported"))}</option>`).join("");
  const flow=["suggest","draft","auto_notify","full_auto"].map(autoLabel).join(" → ");
  document.getElementById("skhint").textContent=t("sk_hint", plabel(data.platform,data.platform), flow);
  const box=document.getElementById("skills");
  const items=data.skills||[];
  if(!items.length){box.innerHTML=`<div class="sub">${esc(t("sk_empty"))}</div>`;return;}
  box.innerHTML=items.map((s,i)=>`
    <div class="skill" onclick="openSkill('${esc(s.platform)}','${esc(s.name)}')">
      <div>
        <div class="nm">${esc(s.display||s.name)}</div>
        <div class="ds">${esc(s.description)}</div>
        <div class="flow">${esc(t("sk_flow"))}</div>
      </div>
      <select onclick="event.stopPropagation()" onchange="quickAutonomy(event,'${esc(s.platform)}','${esc(s.name)}',this)">
        ${(data.levels||[]).map(l=>`<option value="${l.value}" ${l.value===s.autonomy?"selected":""}>${esc(autoLabel(l.value))}</option>`).join("")}
      </select>
    </div>`).join("");
}
async function quickAutonomy(ev,platform,name,selEl){
  ev.stopPropagation();
  const j=await jpost("/api/skills",{platform,name,autonomy:selEl.value});
  selEl.style.borderColor=j.ok?"var(--good)":"var(--bad)";
  setTimeout(()=>selEl.style.borderColor="var(--line)",900);
}

/* ---------- drawer ---------- */
function openDrawerShell(title,bodyHtml,footHtml){
  document.getElementById("dwttl").innerHTML=title;
  document.getElementById("dwbd").innerHTML=bodyHtml;
  document.getElementById("dwft").innerHTML=footHtml;
  document.getElementById("scrim").classList.add("open");
  document.getElementById("drawer").classList.add("open");
}
function closeDrawer(){
  document.getElementById("scrim").classList.remove("open");
  document.getElementById("drawer").classList.remove("open");
}
function setStatus(msg,ok){const e=document.getElementById("dwstatus");if(e){e.textContent=msg;e.className="status "+(ok?"ok":"bad");}}

let CURWF=null;
function openWorkflow(i){
  const w=MAP.workflows[i];if(!w)return;
  CURWF=w.name;
  const steps=(w.steps||[]).map((s,j)=>`<div class="stepline">
      <span class="badge b-${s.bucket}">${esc(bname(s.bucket))}</span>
      <b style="margin-left:6px">${j+1}.</b> ${esc(s.desc)}
      <div class="note">→ ${esc(s.next_action||"")}</div></div>`).join("")||`<div class='note'>${esc(t("dw_nosteps"))}</div>`;
  const inst=(w.instances||[]).length?`<div class="fld"><label>${esc(t("dw_instances"))}</label><div class="note">${(w.instances||[]).map(esc).join("、")}</div></div>`:"";
  const body=`
    <div class="fld"><span class="badge b-${w.primary_bucket}">${esc(bname(w.primary_bucket))}</span>
      <span class="note">${esc(t("dw_meta",w.frequency,w.est_minutes_per_run,w.n_observed))}</span></div>
    <div class="fld"><label>${esc(t("dw_summary"))}</label>${esc(w.summary||"")}</div>
    <div class="fld"><label>${esc(t("dw_next"))}</label>${esc(w.recommendation||"")}</div>
    <div class="fld"><label>${esc(t("dw_steps"))}</label>${steps}</div>${inst}`;
  const foot=`<span id="dwstatus" class="status"></span>
    <button onclick="closeDrawer()">${esc(t("btn_close"))}</button>
    <button class="primary" onclick="promote()">${esc(t("btn_distill"))}</button>`;
  openDrawerShell(esc(t("dw_wf_title",w.name)),body,foot);
}

async function promote(){
  const name=CURWF;if(!name)return;
  setStatus(t("promote_drafting"),true);
  document.querySelector("#dwft .primary").disabled=true;
  const j=await jpost("/api/skill/promote",{workflow:name});
  if(!j.ok){setStatus(t("promote_fail",j.error||"?"),false);document.querySelector("#dwft .primary").disabled=false;return;}
  openSkillEditor(j.platform,j.name,j.content,{isNew:true,fromWorkflow:name});
}

async function openSkill(platform,name){
  const j=await jget(`/api/skill?platform=${encodeURIComponent(platform)}&name=${encodeURIComponent(name)}`);
  if(!j.ok){alert(t("read_fail"));return;}
  openSkillEditor(platform,name,j.content,{isNew:false,path:j.path});
}

function openSkillEditor(platform,name,content,opt){
  opt=opt||{};
  const plat=SKILLPLATS.find(p=>p.key===platform)||{label:platform};
  const levels=window.SKLEVELS||[];
  const tgtSel=`<select id="ed-platform">${SKILLPLATS.filter(p=>p.writable).map(p=>`<option value="${p.key}" ${p.key===platform?"selected":""}>${esc(plabel(p.key,p.label))}</option>`).join("")}</select>`;
  const autoSel=`<select id="ed-autonomy">${levels.map(l=>`<option value="${l.value}" ${l.value==="suggest"?"selected":""}>${esc(autoLabel(l.value))}</option>`).join("")}</select>`;
  const fromTag=opt.fromWorkflow?`<div class="note">${esc(t("ed_from",opt.fromWorkflow))}</div>`:"";
  const pathTag=opt.path?`<div class="note">${esc(t("ed_path",opt.path))}</div>`:"";
  const body=`
    ${fromTag}
    <div class="fld"><label>${esc(t("ed_name"))}</label><input id="ed-name" type="text" value="${esc(name)}"/></div>
    <div class="row" style="margin-bottom:12px">
      <div class="fld" style="flex:1;margin:0"><label>${esc(t("ed_target"))}</label>${tgtSel}</div>
      <div class="fld" style="flex:1;margin:0"><label>${esc(t("ed_autonomy"))}</label>${autoSel}</div>
    </div>
    <div class="fld"><label>${esc(t("ed_content"))}</label>
      <textarea id="ed-content">${esc(content)}</textarea>${pathTag}</div>
    <div class="note">${esc(t("ed_note"))}${plat.skill_note?(" "+esc(plat.skill_note)):""}</div>`;
  const foot=`<span id="dwstatus" class="status"></span>
    <button onclick="closeDrawer()">${esc(t("btn_cancel"))}</button>
    <button class="primary" id="ed-apply" onclick="applySkill()">${esc(t("btn_apply"))}</button>`;
  openDrawerShell(esc(t("ed_title",opt.isNew,name)),body,foot);
}

async function applySkill(){
  const platform=document.getElementById("ed-platform").value;
  const name=document.getElementById("ed-name").value.trim();
  const content=document.getElementById("ed-content").value;
  const autonomy=document.getElementById("ed-autonomy").value;
  if(!name||!content.trim()){setStatus(t("apply_empty"),false);return;}
  document.getElementById("ed-apply").disabled=true;
  setStatus(t("apply_writing"),true);
  const j=await jpost("/api/skill",{platform,name,content,autonomy});
  if(j.ok){
    setStatus(t("apply_ok", j.path, j.backup?j.backup.split("/").pop():""),true);
    await loadSkills();
    setTimeout(closeDrawer,1100);
  }else{
    setStatus(t("fail",j.error||"?"),false);
    document.getElementById("ed-apply").disabled=false;
  }
}

/* ---------- settings ---------- */
function toggleSettings(){
  const s=document.getElementById("settings");
  const show=s.style.display==="none";
  s.style.display=show?"block":"none";
  if(show)loadPlatforms();
}
async function loadPlatforms(){
  PLAT=await jget("/api/platforms");
  document.getElementById("set-sources").innerHTML=PLAT.sources.map(p=>`
    <label class="chk"><input type="checkbox" class="src" value="${p.key}" ${p.enabled?"checked":""} ${p.available?"":"disabled"}/>
      <div><div class="l">${esc(plabel(p.key,p.label))} <span class="pill ${p.available?"on":"off"}">${esc(p.available?t("pill_detected"):t("pill_undetected"))}</span></div>
      <div class="d">${esc(t("set_skilltarget",p.skill_kind))}${p.skill_note?("　"+esc(p.skill_note)):""}</div></div></label>`).join("");
  document.getElementById("set-sinks").innerHTML=PLAT.sinks.map(s=>`
    <label class="chk"><input type="checkbox" class="snk" value="${s.key}" ${s.enabled?"checked":""}/>
      <div><div class="l">${esc(plabel(s.key,s.label))} <span class="pill ${s.available?"on":"off"}">${esc(s.available?t("pill_avail"):t("pill_unset"))}</span></div></div></label>`).join("");
  document.getElementById("set-target").innerHTML=PLAT.sources.map(p=>`<option value="${p.key}" ${p.key===PLAT.skill_target?"selected":""}>${esc(plabel(p.key,p.label))}</option>`).join("");
  document.getElementById("set-slack").value=PLAT.slack_webhook_set?t("slack_masked"):"";
}
async function savePlatforms(){
  const sources=[...document.querySelectorAll(".src:checked")].map(e=>e.value);
  const sinks=[...document.querySelectorAll(".snk:checked")].map(e=>e.value);
  const skill_target=document.getElementById("set-target").value;
  const body={sources,sinks,skill_target};
  const slack=document.getElementById("set-slack").value;
  if(slack && !slack.startsWith("*"))body.slack_webhook=slack;
  const st=document.getElementById("set-status");
  st.textContent=t("saving");st.className="status";
  const j=await jpost("/api/platforms",body);
  if(j.ok){st.textContent=t("saved",(j.saved||[]).join(", "));st.className="status ok";
    loadMap();loadSkills();
  }else{st.textContent=t("fail",j.error||"?");st.className="status bad";}
}

document.addEventListener("keydown",e=>{if(e.key==="Escape")closeDrawer();});

applyStatic();
loadBanner().catch(e=>{document.getElementById("banner").innerHTML=`<div class="err">${esc(t("banner_err",e.message))}</div>`;});
loadMap().catch(e=>{document.getElementById("mapbody").innerHTML=`<tr><td colspan="6" class="err">${esc(t("map_err",e.message))}</td></tr>`;});
loadSkills().catch(e=>{document.getElementById("skills").innerHTML=`<div class="err">${esc(t("sk_err",e.message))}</div>`;});
</script>
</body>
</html>
